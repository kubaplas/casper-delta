[workspace]
members = [
    "casper-delta-contracts",
    "casper-delta-cli",
    "casper_delta_client",
    "casper-delta-collector",
]
exclude = [
    "casper_delta_client",
    "casper_delta_example_client",
    "casper-delta-collector",
]
resolver = "2"

[workspace.dependencies.cucumber]
version = "0.21.0"
features = []

[workspace.dependencies.odra]
version = "2.6.0"
features = []

[workspace.dependencies.odra-bdd]
version = "2.6.0"
features = []

[workspace.dependencies.odra-build]
version = "2.9.0"
features = []

[workspace.dependencies.odra-cli]
version = "2.9.0"
features = []

[workspace.dependencies.odra-core]
version = "2.9.0"
features = []

[workspace.dependencies.odra-modules]
version = "2.9.0"
features = []

[workspace.dependencies.odra-test]
version = "2.9.0"
features = []

[workspace.dependencies.odra-wasm-client]
version = "2.9.0"
features = []

[workspace.dependencies.odra-wasm-client-builder]
version = "2.9.0"
features = []

[workspace.dependencies.styks-contracts]
git = "https://github.com/odradev/styks.git"
branch = "main"
features = []

[workspace.dependencies.styks-core]
git = "https://github.com/odradev/styks.git"
branch = "main"
features = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package]

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
odra = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-cli = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-core = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-modules = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-test = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-wasm-client = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
odra-wasm-client-builder = { git = "https://github.com/odradev/odra.git", branch = "fix/wasm-client-gas-tolerance" }
